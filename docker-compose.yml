version: '3.8'

services:
  cafeteria-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cafeteria-wallet-microservice
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
    volumes:
      - cafeteria-db:/app/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  cafeteria-db:
    driver: local
